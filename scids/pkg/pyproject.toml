[build-system]
requires = ["setuptools>=61.0", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "SciDS"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "pandas",
    "scipy",
    "arrayer",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
