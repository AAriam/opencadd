schema:
  title: AutoDock Atom Types
  summary: AutoDock4 atom types and their properties.
  description: |
    These are used in the AutoDock software suite (e.g. AutoGrid4)
    and file formats (e.g. PDBQT, GPF).
  $comment: |
    An official documentation could not be found.
    The list is taken from below link:
    - https://mmb.irbbarcelona.org/gitlab/BioExcel/structureChecking/blob/5f07d82dc36d1f43733ae3b1ecd9f40aebe8b0a2/biobb_structure_checking/dat/autodock_atomtypes.dat
  type: array
  items:
    title: AutoDock Atom Type
    summary: An atom type used in AutoDock4.
    type: object
    additionalProperties: false
    properties:
      type:
        summary: Atom type as defined in AutoDock.
        type: string
        minLength: 1
        maxLength: 2
      element:
        summary: Chemical element symbol.
        type: string
        minLength: 1
        maxLength: 2
      description:
        summary: Description of the atom type.
        type: string
      hbond_acceptor:
        summary: Whether the atom is a hydrogen bond acceptor.
        type: boolean
        default: false
        description: |
          A hydrogen bond acceptor is an electron pair donor.
      hbond_donor:
        summary: Whether the atom is a hydrogen bond donor.
        type: boolean
        default: false
        description: |
          A hydrogen bond donor is an electron pair acceptor.
      hbond_count:
        summary: Number of possible H-bonds.
        type: [ number, 'null' ]
        minimum: 0
        description: |
          Number of possible H-bonds for directionally H-bonding atoms,
          0 for non H-bonding atoms,
          and null for spherically H-bonding atoms.
        default: null
    required: [ type, element, hbond_acceptor, hbond_donor, hbond_count ]
    oneOf:
      - properties:
          hbond_acceptor:
            const: true
          hbond_count:
            type: number
            minimum: 1
      - properties:
          hbond_donor:
            const: true
          hbond_count:
            type: number
            minimum: 1
      - properties:
          hbond_acceptor:
            const: false
          hbond_donor:
            const: false
          hbond_count:
            type: 'null'
data:
  - type: A
    element: C
    description: Aromatic carbon
  - type: Br
    element: Br
  - type: C
    element: C
    description: Aliphatic carbon
  - type: Ca
    element: Ca
  - type: Cl
    element: Cl
  - type: F
    element: F
  - type: Fe
    element: Fe
  - type: H
    element: H
    description: non H-bonding hydrogen
  - type: HD
    element: H
    description: H-bond donor hydrogen
    hbond_donor: true
    hbond_count: 1
  - type: HS
    element: H
    description: Spherical H-bond donor hydrogen
    hbond_donor: true
    hbond_count: .nan
  - type: I
    element: I
  - type: Mg
    element: Mg
  - type: Mn
    element: Mn
  - type: N
    element: N
    description: Non H-bonding nitrogen
  - type: NA
    element: N
    description: H-bond acceptor nitrogen
    hbond_acceptor: true
    hbond_count: 1
  - type: NS
    element: N
    description: Spherical H-bond acceptor nitrogen
    hbond_acceptor: true
    hbond_count: .nan
  - type: OA
    element: O
    description: H-bond acceptor oxygen
    hbond_acceptor: true
    hbond_count: 2
  - type: OS
    element: O
    description: Spherical H-bond acceptor oxygen
    hbond_acceptor: true
    hbond_count: .nan
  - type: P
    element: P
  - type: S
    element: S
    description: Non H-bonding sulfur
  - type: SA
    element: S
    description: H-bond acceptor sulfur
    hbond_acceptor: true
    hbond_count: 2
  - type: Zn
    element: Zn
