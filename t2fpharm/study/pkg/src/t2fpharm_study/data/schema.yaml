title: T2FPharm Study Inputs
type: object
additionalProperties: false
required: [pocket, field, receptor_groups, job]
properties:
  pocket:
    description: Configuration for pocket detection.
    type: object
    additionalProperties: false
    required: [grid_spacing, ligand_radii_offset]
    properties:
      grid_spacing:
        description: Spacing (in Å) between grid points for the pocket and field.
        type: number
        exclusiveMinimum: 0
      ligand_radii_offset:
        description: Offset (in Å) to the radii of the ligand atoms for pocket generation.
        type: number
        minimum: 0
      opening_radius:
        description: Radius (in Å) for the morphological opening operation in pocket detection.
        type: number
        minimum: 0
      erosion_radius:
        description: Radius (in Å) for the morphological erosion operation in pocket detection.
        type: number
        minimum: 0
  field:
    description: Configuration for the field generation.
    type: object
    additionalProperties: false
    required: [ligand_types, smooth, dielectric]
    properties:
      ligand_types:
        description: List of AutoDock atom types to generate fields for.
        type: array
        items:
          type: string
      smooth:
        description: Smoothing factor for AutoGrid.
        type: number
        minimum: 0
      dielectric:
        description: Dielectric constant for AutoGrid.
        type: number
  receptor_groups:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, name, ref_structure]
      properties:
        id:
          type: string
          description: Unique identifier for the protein family.
        name:
          type: string
          description: Full name of the protein family.
        ref_structure:
          summary: Reference structure for the protein family.
          $ref: '#/definitions/structure'
        structures:
          type: array
          items:
            title: Structure
            summary: A structure in the protein family.
            $ref: '#/definitions/structure'
        color_bg:
          type: string
          description: Background color for the protein family in DataFrames.
          pattern: '^#[0-9A-Fa-f]{6}$'
        color_text:
          type: string
          description: Text color for the protein family in DataFrames.
          pattern: '^#[0-9A-Fa-f]{6}$'
  job:
    type: object
    additionalProperties:
      oneOf:
        - type: object
          properties:
            method:
              constant: cnn
        - type: object
          properties:
            method:
              constant: largest_peaks

definitions:
  structure:
    type: object
    additionalProperties: false
    required: [pdb_id, chain_id]
    properties:
      pdb_id:
        title: PDB ID
        summary: PDB ID of the structure.
        type: string
        pattern: '^[1-9][A-Za-z0-9]{3}$'
      chain_id:
        title: Chain ID
        summary: Chain ID of the representative chain in the structure.
        type: string
      ref_ligand:
        description: Reference ligand in the structure.
        type: object
        additionalProperties: false
        required: [res_name, chain_id, res_seq]
