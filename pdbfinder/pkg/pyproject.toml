[build-system]
requires = ["setuptools>=61.0", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "PDBFinder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sciapi",
    "scifile",
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "biopython",
    "rcsbapi",
    "pyserials",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
